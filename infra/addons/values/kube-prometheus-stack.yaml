# Values for the kube-prometheus-stack Helm chart.
# Tuned for a small, short-lived test cluster: no persistent storage, short retention.

# No alert routing yet. Alerts are still visible in the Prometheus UI.
alertmanager:
  enabled: false

# The EKS control plane is managed by AWS and cannot be scraped.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
# EKS kube-proxy exposes metrics on localhost only.
kubeProxy:
  enabled: false

grafana:
  # Picks up dashboards from ConfigMaps labelled grafana_dashboard=1 in any namespace,
  # e.g. apps/retail-store/dashboards.
  sidecar:
    dashboards:
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    retention: 1d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

    # Scrapes every pod annotated with prometheus.io/scrape=true.
    # Same job as in the EKS Workshop "Open source metrics" module.
    additionalScrapeConfigs:
      - job_name: kubernetes-pods
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            regex: (https?)
            target_label: __scheme__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed|Completed
            action: drop
