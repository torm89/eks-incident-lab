# Unit tests for the alerting rules: synthetic metrics in, expected alerts out.
# Run with: uv run scripts/test_alerts.py
# Firing alerts are checked through the ALERTS series, so tests do not depend on annotation texts.
rule_files:
  - slo-rules.yaml
  - cause-rules.yaml

evaluation_interval: 15s

tests:
  - name: Store outage pages within 2 minutes
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/home", status="500"}'
        values: '0+15x80'   # 1 request/s, all failing
    promql_expr_test:
      - expr: count(ALERTS{alertname="StoreAvailabilityBudgetBurnFast", alertstate="firing", severity="critical"})
        eval_time: 2m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: 7% errors open a ticket, not a page
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/home", status="500"}'
        values: '0+7x160'   # 0.47 errors/s
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/home", status="200"}'
        values: '0+93x160'  # 6.2 successes/s -> 7% errors
    promql_expr_test:
      - expr: count(ALERTS{alertname="StoreAvailabilityBudgetBurnSlow", alertstate="firing", severity="warning"})
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: absent(ALERTS{alertname="StoreAvailabilityBudgetBurnFast", alertstate="firing"})
        eval_time: 10m
        exp_samples:
          - labels: '{alertname="StoreAvailabilityBudgetBurnFast", alertstate="firing"}'
            value: 1

  - name: A broken checkout pages, although the store-wide error ratio stays low
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/catalog/{id}", status="200"}'
        values: '0+240x80'  # 16 browsing requests/s
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/checkout", status="200"}'
        values: '0+30x80'   # 2 checkout steps/s that work
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/checkout/payment", status="500"}'
        values: '0+10x80'   # 0.67 payments/s, all failing: 4% of the store, 25% of the checkout
    promql_expr_test:
      - expr: count(ALERTS{alertname="StoreCheckoutBudgetBurnFast", alertstate="firing", severity="critical"})
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: absent(ALERTS{alertname=~"StoreAvailabilityBudgetBurn.*", alertstate="firing"})
        eval_time: 10m
        exp_samples:
          - labels: '{alertstate="firing"}'
            value: 1

  - name: An unreachable UI is caught although the SLOs see no requests
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/home", status="200"}'
        values: '0+225x20 _x40'  # 15 requests/s, then the UI is gone (no samples)
      - series: 'kube_deployment_status_replicas_available{namespace="traffic", deployment="load-generator"}'
        values: '1x60'
    promql_expr_test:
      - expr: count(ALERTS{alertname="StoreTrafficLost", alertstate="firing", severity="warning"})
        eval_time: 14m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: No traffic alert when the load generator is stopped
    interval: 15s
    input_series:
      - series: 'kube_deployment_status_replicas_available{namespace="traffic", deployment="load-generator"}'
        values: '0x60'
    promql_expr_test:
      - expr: absent(ALERTS{alertname="StoreTrafficLost"})
        eval_time: 10m
        exp_samples:
          - labels: '{alertname="StoreTrafficLost"}'
            value: 1

  - name: A pod that keeps dropping out of its Service
    interval: 15s
    input_series:
      - series: 'kube_pod_status_ready{namespace="retail-store", condition="true", pod="ui-1"}'
        values: '1x8 0x4 1x8 0x4 1x8 0x4 1x8'  # not ready for 1 minute, three times
    promql_expr_test:
      - expr: count(ALERTS{alertname="PodReadinessFlapping", alertstate="firing", pod="ui-1"})
        eval_time: 9m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: A deleted pod stops alerting, although its flapping is still in the window
    interval: 15s
    input_series:
      - series: 'kube_pod_status_ready{namespace="retail-store", condition="true", pod="ui-1"}'
        values: '1x4 0x4 1x4 0x4 1x4 0x4 1x4 stale'  # deleted after 9 minutes
    promql_expr_test:
      - expr: absent(ALERTS{alertname="PodReadinessFlapping", alertstate="firing"})
        eval_time: 10m
        exp_samples:
          - labels: '{alertname="PodReadinessFlapping", alertstate="firing"}'
            value: 1

  - name: A single restart is not flapping
    interval: 15s
    input_series:
      - series: 'kube_pod_status_ready{namespace="retail-store", condition="true", pod="ui-1"}'
        values: '1x8 0x4 1x40'
    promql_expr_test:
      - expr: absent(ALERTS{alertname="PodReadinessFlapping"})
        eval_time: 10m
        exp_samples:
          - labels: '{alertname="PodReadinessFlapping"}'
            value: 1

  - name: Errors within the error budget stay quiet
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/home", status="500"}'
        values: '0+1x160'
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/home", status="200"}'
        values: '0+199x160' # 0.5% errors
    promql_expr_test:
      - expr: absent(ALERTS{service="retail-store", alertstate="firing"})
        eval_time: 30m
        exp_samples:
          - labels: '{alertstate="firing", service="retail-store"}'
            value: 1

  - name: No failures at all give an error ratio of 0, not an empty series
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/home", status="200"}'
        values: '0+15x40'   # only successful requests: no 5xx series exists
    promql_expr_test:
      - expr: slo:sli_error:ratio_rate5m{slo="store-availability"}
        eval_time: 5m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{slo="store-availability", service="retail-store"}'
            value: 0

  - name: Slow store pages
    interval: 15s
    input_series:
      - series: 'http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri="/catalog"}'
        values: '0+15x80'   # 1 request/s
      - series: 'http_server_requests_seconds_bucket{namespace="retail-store", app_kubernetes_io_name="ui", uri="/catalog", le="1.0"}'
        values: '0+3x80'    # only 20% faster than 1 s
    promql_expr_test:
      - expr: count(ALERTS{alertname="StoreLatencyBudgetBurnFast", alertstate="firing"})
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: Low traffic does not page on a few errors
    interval: 15s
    input_series:
      - series: 'ai_assistant_chat_requests_total{namespace="ai-assistant", outcome="llm_error"}'
        values: '0+0.125x80' # 100% errors, but only 2.5 questions per 5 minutes
    promql_expr_test:
      - expr: absent(ALERTS{alertname="AssistantAvailabilityBudgetBurnFast", alertstate="firing"})
        eval_time: 10m
        exp_samples:
          - labels: '{alertname="AssistantAvailabilityBudgetBurnFast", alertstate="firing"}'
            value: 1

  - name: Failing tools page even when answers return HTTP 200
    interval: 15s
    input_series:
      - series: 'ai_assistant_tool_call_duration_seconds_count{namespace="ai-assistant", tool="search_products", outcome="error"}'
        values: '0+3x80'    # 0.2 tool calls/s, all failing
      - series: 'ai_assistant_chat_requests_total{namespace="ai-assistant", outcome="success"}'
        values: '0+3x80'    # every answer still "succeeds"
    promql_expr_test:
      - expr: count(ALERTS{alertname="AssistantToolQualityBudgetBurnFast", alertstate="firing"})
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 1
      - expr: absent(ALERTS{alertname="AssistantAvailabilityBudgetBurnFast", alertstate="firing"})
        eval_time: 3m
        exp_samples:
          - labels: '{alertname="AssistantAvailabilityBudgetBurnFast", alertstate="firing"}'
            value: 1

  - name: Data store down
    interval: 15s
    input_series:
      - series: 'kube_pod_status_ready{namespace="retail-store", condition="true", pod="catalog-mysql-0"}'
        values: '1x4 0x20'  # becomes not ready after 1 minute
    promql_expr_test:
      - expr: count(ALERTS{alertname="DataStoreNotReady", alertstate="firing", pod="catalog-mysql-0"})
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: High estimated cost in mock mode does not alert
    interval: 15s
    input_series:
      - series: 'ai_assistant_llm_cost_usd_total{gen_ai_request_model="claude-haiku-4-5"}'
        values: '0+0.025x120'  # $6 per hour, estimated
      - series: 'llm_gateway_requests_total{mode="mock", status="200"}'
        values: '0+30x120'
    promql_expr_test:
      - expr: absent(ALERTS{alertname="LlmCostBudgetExceeded", alertstate="firing"})
        eval_time: 25m
        exp_samples:
          - labels: '{alertname="LlmCostBudgetExceeded", alertstate="firing"}'
            value: 1

  - name: High spend with the real API alerts
    interval: 15s
    input_series:
      - series: 'ai_assistant_llm_cost_usd_total{gen_ai_request_model="claude-haiku-4-5"}'
        values: '0+0.025x120'  # $6 per hour
      - series: 'llm_gateway_requests_total{mode="real", status="200"}'
        values: '0+30x120'
    promql_expr_test:
      - expr: count(ALERTS{alertname="LlmCostBudgetExceeded", alertstate="firing"})
        eval_time: 25m
        exp_samples:
          - labels: '{}'
            value: 1

  - name: SDK retries amplify LLM load
    interval: 15s
    input_series:
      - series: 'llm_gateway_requests_total{mode="mock", status="429"}'
        values: '0+9x80'    # 0.6 requests/s at the gateway
      - series: 'gen_ai_client_operation_duration_seconds_count{gen_ai_request_model="claude-haiku-4-5", error_type="429"}'
        values: '0+3x80'    # 0.2 LLM calls/s -> 3 requests per call
    promql_expr_test:
      - expr: count(ALERTS{alertname="LlmRetryAmplification", alertstate="firing"})
        eval_time: 8m
        exp_samples:
          - labels: '{}'
            value: 1
