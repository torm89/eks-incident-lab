# Generated by scripts/generate_alerts.py. Do not edit by hand.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cause-rules
  namespace: monitoring
spec:
  groups:
  - name: cause-alerts
    rules:
    - alert: DataStoreNotReady
      expr: max by (namespace, pod) (kube_pod_status_ready{namespace="retail-store", condition="true", pod=~".*(mysql|postgresql|redis|rabbitmq|dynamodb).*"}) == 0
      for: 1m
      labels:
        severity: warning
        service: retail-store
      annotations:
        summary: Data store pod {{ $labels.pod }} is not ready.
        description: A database, cache or queue of the store is down. Services that depend on it fail or lose data.
        runbook_url: https://github.com/torm89/eks-incident-lab/blob/main/docs/runbooks/alerts.md#datastorenotready
        dashboard: /d/retail-store
    - alert: StoreTrafficLost
      expr: |-
        (sum(rate(http_server_requests_seconds_count{namespace="retail-store", app_kubernetes_io_name="ui", uri!~"/actuator.*"}[2m])) or vector(0)) < 2
        and on () sum(kube_deployment_status_replicas_available{namespace="traffic", deployment="load-generator"}) > 0
      for: 2m
      labels:
        severity: warning
        service: retail-store
      annotations:
        summary: The store UI receives {{ $value | humanize }} requests/s while the load generator is running.
        description: 'Requests do not reach the UI (pod not ready, no Service endpoints, network) or the UI is too slow to accept them. The SLOs are blind here: the UI cannot count requests that never arrive.'
        runbook_url: https://github.com/torm89/eks-incident-lab/blob/main/docs/runbooks/alerts.md#storetrafficlost
        dashboard: /d/retail-store
    - alert: PodReadinessFlapping
      expr: |-
        changes(kube_pod_status_ready{namespace=~"retail-store|ai-assistant", condition="true"}[10m]) >= 4
        and on (namespace, pod) kube_pod_status_ready{namespace=~"retail-store|ai-assistant", condition="true"}
      for: 1m
      labels:
        severity: warning
        service: '{{ $labels.namespace }}'
      annotations:
        summary: Pod {{ $labels.pod }} changed its readiness {{ $value }} times in 10 minutes.
        description: 'Its readiness probe times out now and then: the pod is overloaded or waits on a slow dependency. While it is not ready it gets no traffic, and its own metrics miss the requests that time out in front of it.'
        runbook_url: https://github.com/torm89/eks-incident-lab/blob/main/docs/runbooks/alerts.md#podreadinessflapping
        dashboard: /d/{{ $labels.namespace }}
    - alert: PodMemoryNearLimit
      expr: |-
        sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~"retail-store|ai-assistant", container!=""})
        / sum by (namespace, pod) (kube_pod_container_resource_limits{namespace=~"retail-store|ai-assistant", resource="memory"}) > 0.9
      for: 5m
      labels:
        severity: warning
        service: '{{ $labels.namespace }}'
      annotations:
        summary: Pod {{ $labels.pod }} uses {{ $value | humanizePercentage }} of its memory limit.
        description: At 100% the container is OOM-killed and restarted.
        runbook_url: https://github.com/torm89/eks-incident-lab/blob/main/docs/runbooks/alerts.md#podmemorynearlimit
        dashboard: /d/{{ $labels.namespace }}
    - alert: LlmRetryAmplification
      expr: |-
        sum(rate(llm_gateway_requests_total[5m])) / sum(rate(gen_ai_client_operation_duration_seconds_count[5m])) > 1.5
        and sum(rate(gen_ai_client_operation_duration_seconds_count[5m])) * 300 >= 10
      for: 2m
      labels:
        severity: warning
        service: ai-assistant
      annotations:
        summary: The LLM API gets {{ $value | humanize }} requests per LLM call.
        description: 'SDK retries multiply the load: the LLM API is rate limited or failing (429, 529, 5xx, timeouts).'
        runbook_url: https://github.com/torm89/eks-incident-lab/blob/main/docs/runbooks/alerts.md#llmretryamplification
        dashboard: /d/ai-assistant
    - alert: LlmCostBudgetExceeded
      expr: |-
        sum(rate(ai_assistant_llm_cost_usd_total[15m])) * 3600 > 3
        and on () sum(rate(llm_gateway_requests_total{mode="real"}[15m])) > 0
      for: 5m
      labels:
        severity: warning
        service: ai-assistant
      annotations:
        summary: 'LLM spend is {{ $value | humanize }} USD per hour (budget: 3 USD).'
        description: More traffic, longer prompts or a looping agent. Fires only when the gateway uses the real Anthropic API.
        runbook_url: https://github.com/torm89/eks-incident-lab/blob/main/docs/runbooks/alerts.md#llmcostbudgetexceeded
        dashboard: /d/ai-assistant
