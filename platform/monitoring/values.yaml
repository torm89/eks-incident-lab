# Values for the kube-prometheus-stack Helm chart.
# Tuned for a small, short-lived test cluster: no persistent storage, short retention.

# Alertmanager: grouping, inhibition and routing. No notifications yet ("UI only"):
# firing alerts are visible in the Alertmanager UI and in Grafana.
alertmanager:
  enabled: true
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ui-only
      group_by: [alertname, slo, namespace]
      group_wait: 30s
      group_interval: 2m
      repeat_interval: 1h
      routes:
        # Heartbeat alerts from kube-prometheus-stack: always firing by design.
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
    inhibit_rules:
      # A fast burn (page) makes the slow burn (ticket) of the same SLO redundant.
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity = "warning"']
        equal: [slo]
      # Built-in rule: a critical alert silences warnings of the same alert in the same namespace.
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: [namespace, alertname]
    # Receivers without integrations: alerts show up in the UI only.
    # Slack, Discord or e-mail can be added later (the webhook belongs in a Secret, not in the repo).
    receivers:
      - name: ui-only
      - name: "null"
  alertmanagerSpec:
    retention: 24h
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

# The EKS control plane is managed by AWS and cannot be scraped.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
# EKS kube-proxy exposes metrics on localhost only.
kubeProxy:
  enabled: false

prometheusOperator:
  # The webhook certificates are created by Helm hooks, which "kubectl apply" does not run.
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false

grafana:
  # Helm test hooks are not run by "kubectl apply" and would be created as a plain Pod.
  testFramework:
    enabled: false
  # Grafana is reachable only through "kubectl port-forward", which already needs
  # cluster credentials. So no login screen: every visitor is an admin.
  grafana.ini:
    auth:
      disable_login_form: true
    auth.anonymous:
      enabled: true
      org_role: Admin
  # Dashboards come from ConfigMaps labelled grafana_dashboard=1
  # (see dashboards/ and configMapGenerator in kustomization.yaml).

prometheus:
  prometheusSpec:
    # Load every PrometheusRule in the cluster, not only those labelled for this Helm release
    # (e.g. platform/monitoring/alerts/).
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    retention: 1d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1Gi

    # Scrapes every pod annotated with prometheus.io/scrape=true.
    # Same job as in the EKS Workshop "Open source metrics" module.
    additionalScrapeConfigs:
      - job_name: kubernetes-pods
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme]
            action: replace
            regex: (https?)
            target_label: __scheme__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            regex: (.+)
            target_label: __metrics_path__
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Pending|Succeeded|Failed|Completed
            action: drop
