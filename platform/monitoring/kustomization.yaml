# Prometheus + Grafana (kube-prometheus-stack).
# Deploy order: crds/ first, then this directory. See README.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

# Grafana dashboards. Picked up by the Grafana sidecar via the grafana_dashboard label.
configMapGenerator:
  - name: retail-store-dashboard
    namespace: monitoring
    files:
      - dashboards/retail-store.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: ai-assistant-dashboard
    namespace: monitoring
    files:
      - dashboards/ai-assistant.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 91.8.2 # operator v0.94.1
    releaseName: kube-prometheus-stack
    namespace: monitoring
    includeCRDs: false # managed in crds/
    valuesFile: values.yaml
