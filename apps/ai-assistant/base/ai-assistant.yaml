apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-assistant
  labels:
    app.kubernetes.io/name: ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-assistant
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics/
    spec:
      containers:
        - name: ai-assistant
          image: ai-assistant
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LLM_GATEWAY_URL
              value: http://llm-gateway
            - name: CATALOG_URL
              value: http://catalog.retail-store.svc
            - name: LLM_MODEL
              value: claude-haiku-4-5
            # Hard limit on LLM calls per question: caps the cost of a looping agent.
            - name: LLM_MAX_AGENT_STEPS
              value: "5"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: ai-assistant
spec:
  selector:
    app.kubernetes.io/name: ai-assistant
  ports:
    - name: http
      port: 80
      targetPort: http
