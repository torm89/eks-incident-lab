# AI shopping assistant (our own code in services/) and the LLM gateway in front of the Anthropic API.
# The gateway runs in mock mode by default: no API key, no cost.
# Real API: ../overlays/real-api (see apps/ai-assistant/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-assistant

resources:
  - namespace.yaml
  - llm-gateway.yaml
  - ai-assistant.yaml

# Image registry and tags: the component below is generated by scripts/push_images.py
# (git-ignored, so no AWS account ID is stored in the repo). Run the script before applying.
components:
  - ../registry
