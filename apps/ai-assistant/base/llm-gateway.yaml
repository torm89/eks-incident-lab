apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    app.kubernetes.io/name: llm-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics/
    spec:
      containers:
        - name: llm-gateway
          image: llm-gateway
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LLM_MODE
              value: mock
          # The key is a file, re-read on every request: a changed Secret takes effect without a restart.
          volumeMounts:
            - name: anthropic-api-key
              mountPath: /var/run/secrets/anthropic
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
      volumes:
        # Needed in real mode. Optional, so mock mode needs no Secret.
        - name: anthropic-api-key
          secret:
            secretName: anthropic-api-key
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
spec:
  selector:
    app.kubernetes.io/name: llm-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
