# Sends requests to the real Anthropic API. This costs money.
# Needs the Secret anthropic-api-key first, see apps/ai-assistant/README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: llm-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: real
