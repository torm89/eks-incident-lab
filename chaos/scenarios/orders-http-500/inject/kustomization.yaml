apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base

namePrefix: orders-http-500-inject-

patches:
  - target:
      kind: Job
      name: chaos-request
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args
        value: ["--fail", "--silent", "--show-error", "--request", "POST", "http://orders.retail-store.svc/chaos/status/500"]
