# Breaks the network between the checkout service and its Redis for 5 minutes.
# Applied on the Redis side: checkout calls Redis through its Service (ClusterIP), which is translated to the pod IP
# only outside the checkout pod, so a filter on checkout's outgoing packets would never match the Redis pod IP.
# Redis's replies to checkout carry the real pod IPs, so dropping them cuts the connection.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: checkout-redis-network-loss
  namespace: chaos-mesh
spec:
  action: loss
  mode: all
  selector:
    namespaces:
      - retail-store
    labelSelectors:
      app.kubernetes.io/name: checkout
      app.kubernetes.io/component: redis
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - retail-store
      labelSelectors:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/component: service
  loss:
    loss: "100"
    correlation: "0"
  duration: 5m
