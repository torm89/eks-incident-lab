apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-load-generator
  labels:
    app.kubernetes.io/name: ai-load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-load-generator
    spec:
      containers:
        - name: artillery
          image: artilleryio/artillery:2.0.34
          args:
            - run
            - --target
            - http://ai-assistant.ai-assistant.svc
            # One question per second: enough samples for smooth rates and percentiles. Free with the mock LLM.
            # With the real Anthropic API use traffic/ai-assistant-real-api instead (one question every 10 s).
            - --overrides
            - '{"config":{"phases":[{"duration":86400,"arrivalRate":1}]}}'
            - /scenario/scenario.yml
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - name: scenario
              mountPath: /scenario
      volumes:
        - name: scenario
          configMap:
            name: ai-scenario
