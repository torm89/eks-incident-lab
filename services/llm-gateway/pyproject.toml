[project]
name = "llm-gateway"
version = "0.1.0"
description = "Proxy in front of the Anthropic Messages API: mock or real upstream, with fault injection."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
    "httpx2>=2.13,<3",
    "prometheus-client>=0.26,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
