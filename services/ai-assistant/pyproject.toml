[project]
name = "ai-assistant"
version = "0.1.0"
description = "Shopping assistant for the Retail Store: Claude with tools that query the catalog."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11,<2",
    "fastapi>=0.142,<1",
    "uvicorn>=0.54,<1",
    "httpx2>=2.13,<3",
    "prometheus-client>=0.26,<1",
]

[dependency-groups]
dev = [
    "pytest>=9,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
